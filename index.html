<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Especializado - Firma Digital</title>
    <!-- Fuente Inter y Fuentes de Sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Librería oficial de Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #0052cc;
            --primary-hover: #003d99;
            --bg-gradient: linear-gradient(135deg, #f0f4f9 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-icon {
            font-size: 36px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Buscador principal */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #ffffff;
            color: var(--text-main);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.12);
        }

        button.btn-search {
            padding: 14px 28px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.2);
        }

        button.btn-search:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button.btn-search:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Sugerencias Rápidas (Chips) */
        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            align-items: center;
        }

        .quick-tags span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .tag {
            background-color: #f1f5f9;
            color: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
        }

        .tag:hover {
            background-color: #e2e8f0;
            color: var(--primary);
            border-color: #cbd5e1;
        }

        /* Bloque de Resultados */
        .resultado-box {
            background-color: var(--accent-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary);
            padding: 24px;
            border-radius: 10px;
            min-height: 120px;
            line-height: 1.7;
            font-size: 15px;
            position: relative;
        }

        /* Estilos Markdown */
        .resultado-box h2, .resultado-box h3 {
            color: #0f172a;
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 17px;
        }

        .resultado-box ul, .resultado-box ol {
            padding-left: 20px;
            margin-bottom: 12px;
        }

        .resultado-box a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid rgba(0, 82, 204, 0.3);
            transition: border 0.2s;
        }

        .resultado-box a:hover {
            border-bottom-color: var(--primary);
        }

        .resultado-box code {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        .status {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
            font-style: italic;
        }

        /* Spinner Animado */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 0.8s linear infinite;
        }

        .spinner-dark {
            border-color: var(--primary);
            border-bottom-color: transparent;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }
            button.btn-search {
                width: 100%;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="header-icon">🔑</span>
        <h1>Asistente de Firma Digital Argentina</h1>
        <p class="subtitle">Guías rápidas para configuración de Tokens USB, drivers y certificados digitalizados.</p>
    </div>

    <div class="search-box">
        <input type="text" id="userInput" placeholder="Ej: ¿Cómo instalo el token ePass2003 en Windows?..." onkeydown="if(event.key === 'Enter') enviarConsulta()">
        <button id="sendBtn" class="btn-search" onclick="enviarConsulta()">
            <span id="btnText">Buscar</span>
        </button>
    </div>

    <div class="quick-tags">
        <span>Consultas frecuentes:</span>
        <div class="tag" onclick="usarSugerencia('Instalar ePass2003 en Windows')">🔌 Driver ePass2003</div>
        <div class="tag" onclick="usarSugerencia('Descargar drivers mToken CriptoID')">📥 mToken CriptoID</div>
        <div class="tag" onclick="usarSugerencia('Como importar certificados ONTI')">📜 Certificados ONTI</div>
        <div class="tag" onclick="usarSugerencia('Drivers SafeNet Argentina')">🛡️ SafeNet</div>
    </div>

    <div id="output" class="resultado-box">
        <span class="status">Escribí tu consulta arriba o elegí una opción rápida para comenzar.</span>
    </div>
</div>

<script>
    const BACKEND_URL = "https://buscador-firma-digital.onrender.com";

    function usarSugerencia(texto) {
        const inputEl = document.getElementById('userInput');
        inputEl.value = texto;
        enviarConsulta();
    }

    async function enviarConsulta() {
        const inputEl = document.getElementById('userInput');
        const outputEl = document.getElementById('output');
        const btnEl = document.getElementById('sendBtn');
        const query = inputEl.value.trim();
        if (!query) return;
        
        inputEl.disabled = true;
        btnEl.disabled = true;
        btnEl.innerHTML = '<span class="spinner"></span> Buscando...';
        outputEl.innerHTML = '<span class="status"><span class="spinner spinner-dark"></span> Conectando con el motor en la nube... (si Render está inactivo, puede demorar unos segundos)</span>';
        
        try {
            const response = await fetch(`${BACKEND_URL}/api/buscar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: query })
            });
            if (!response.ok) throw new Error('Error en el servidor.');
            const data = await response.json();
            outputEl.innerHTML = marked.parse(data.respuesta);
        } catch (error) {
            outputEl.innerHTML = '<span style="color: #dc2626; font-weight: 600;">⚠️ No se pudo conectar con el servidor. Si el motor en Render estuvo inactivo, esperá un minuto y reintentá.</span>';
        } finally {
            inputEl.disabled = false;
            btnEl.disabled = false;
            btnEl.innerHTML = '<span id="btnText">Buscar</span>';
            inputEl.focus();
        }
    }
</script>
</body>
</html>
